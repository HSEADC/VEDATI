<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека</title>
    <!-- OpenGraph Мета-теги: -->
    <meta property="og:title" content="Образовательный медиа-сервис ВЕДАТИ" />
    <meta
      property="og:description"
      content="Библиотека популяризирующая старорусскую речь через призму повседневной жизни и мемов"
    />
    <meta property="og:image" content="images/meta.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hseadc.github.io/VEDATI/" />

    <!-- Twitter Мета-теги: -->
    <meta name="twitter:title" content="Образовательный медиа-сервис ВЕДАТИ" />
    <meta
      name="twitter:description"
      content="Библиотека популяризирующая старорусскую речь через призму повседневной жизни и мемов"
    />
    <meta name="twitter:image" content="images/meta.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hseadc.github.io/VEDATI/" />
  </head>
  <body class="BlackBack BlackNav">
    <!-- карточки -->
    <section class="C_LibraryWordCards W_OtherHeader">
      <!-- меню -->
      <div id="root"></div>

      <div class="M_ScreenHeader WhiteText">
        <h3>БИБЛИОТЕКА КАРТОЧЕК</h3>
      </div>
      <div class="O_Filters">
        <button
          class="A_FilterBtn active"
          onclick="toggleMainFilter('all', this)"
        >
          все
        </button>
        <button class="A_FilterBtn" onclick="toggleMainFilter('words', this)">
          слова
        </button>
        <button class="A_FilterBtn" onclick="toggleMainFilter('phrases', this)">
          фразы
        </button>
      </div>

      <div id="M_WordSubfilters" class="M_SubFilters">
        <button
          class="A_SubFilterBtn A_how-howFilter A_Filter"
          onclick="filterCards('how-how', this)"
        >
          как?
        </button>
        <button
          class="A_SubFilterBtn A_who-whoFilter A_Filter"
          onclick="filterCards('who-who', this)"
        >
          кто-кто?
        </button>
        <button
          class="A_SubFilterBtn A_thingsFilter A_Filter"
          onclick="filterCards('things', this)"
        >
          вещицы
        </button>
        <button
          class="A_SubFilterBtn A_whatdoingFilter A_Filter"
          onclick="filterCards('whatdoing', this)"
        >
          что делати?
        </button>
        <button
          class="A_SubFilterBtn A_tendernessFilter A_Filter"
          onclick="filterCards('tenderness', this)"
        >
          нежности
        </button>
      </div>

      <div id="M_PhraseSubfilters" class="M_SubFilters">
        <button
          class="A_SubFilterBtn A_proverbsFilter A_Filter"
          onclick="filterCards('proverbs', this)"
        >
          пословицы
        </button>
        <button
          class="A_SubFilterBtn A_sayingsFilter A_Filter"
          onclick="filterCards('sayings', this)"
        >
          поговорки
        </button>
        <button
          class="A_SubFilterBtn A_idiomsFilter A_Filter"
          onclick="filterCards('idioms', this)"
        >
          фразеологизмы
        </button>
      </div>

      <div id="dynamic-card-container" class="S_CardGrid"></div>
    </section>

    <!-- футер код -->
    <div id="footer-root"></div>
  </body>
</html>
